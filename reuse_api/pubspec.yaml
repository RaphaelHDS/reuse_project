# =====================================================================
# pubspec.yaml da API do ReUse
# Este arquivo diz o nome do projeto e quais "pacotes" (bibliotecas
# prontas) ele usa. O comando "dart pub get" baixa esses pacotes.
# =====================================================================
name: reuse_api
description: API do ReUse (back-end em Dart) - plataforma para reaproveitamento de materiais.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  shelf: ^1.4.1          # servidor web (recebe e responde requisições)
  shelf_router: ^1.1.4   # organiza as rotas, ex.: GET /anuncios
  mysql_client: ^0.0.27  # conversa com o banco MySQL/MariaDB
  crypto: ^3.0.3         # gera o "hash" das senhas (SHA-256)
